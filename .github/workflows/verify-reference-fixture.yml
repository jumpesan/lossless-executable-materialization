name: Verify reference fixture

on:
  push:
    paths:
      - "fixtures/**"
      - ".github/workflows/verify-reference-fixture.yml"
  pull_request:
    paths:
      - "fixtures/**"
      - ".github/workflows/verify-reference-fixture.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile fixture tooling
        run: |
          python -m py_compile fixtures/generate_reference_fixture.py
          python -m py_compile fixtures/verify_reference_fixture.py

      - name: Verify published representation
        run: python fixtures/verify_reference_fixture.py
